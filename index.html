<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Formulário Responsivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSS externo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="form-container">
    <h1>Cadastro</h1>

    <form action="#" method="post" enctype="multipart/form-data">
      <!-- Dados pessoais -->
      <div class="form-grid">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" />
        </div>

        <div class="form-group">
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento" />
        </div>
      </div>

      <!-- Seleções -->
      <div class="form-grid">
        <div class="form-group">
          <label for="genero">Gênero</label>
          <select id="genero" name="genero">
            <option value="">Selecione</option>
            <option value="feminino">Feminino</option>
            <option value="masculino">Masculino</option>
            <option value="outro">Outro</option>
            <option value="prefiro_nao_informar">Prefiro não informar</option>
          </select>
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select id="estado" name="estado">
            <option value="">Selecione</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="RS">Rio Grande do Sul</option>
            <!-- Adicione mais estados se quiser -->
          </select>
        </div>
      </div>

      <!-- Upload de imagem -->
      <div class="form-group">
        <label for="foto">Foto / Imagem</label>
        <input type="file" id="foto" name="foto" accept="image/*" />
        <small>Formatos aceitos: JPG, PNG, GIF</small>
      </div>

      <!-- Mensagem -->
      <div class="form-group">
        <label for="sobre">Sobre você</label>
        <textarea id="sobre" name="sobre" rows="4" placeholder="Escreva um breve texto sobre você..."></textarea>
      </div>

      <!-- Termos -->
      <div class="form-group form-group-inline">
        <label class="checkbox-label">
          <input type="checkbox" id="termos" name="termos" required />
          <span>Li e aceito os termos de uso</span>
        </label>
      </div>

      <!-- Botões -->
      <div class="form-actions">
        <button type="reset" class="btn-secondary">Limpar</button>
        <button type="submit" class="btn-primary">Enviar</button>
      </div>
    </form>
  </div>
</body>
</html>
